non_relations:
- pair:
  - ROOF.PREP_ACCEPT
  - ROOF.LEVEL
  reason: приёмка и нивелировка независимы
- pair:
  - ROOF.LEVEL
  - ROOF.BASE_CLEAN
  reason: геодезист и кровельщики; порядок — загрузка
- pair:
  - ROOF.PARAPET_PLASTER
  - ROOF.BASE_CLEAN
  reason: разные бригады (штукатуры и кровельщики)
- pair:
  - ROOF.PARAPET_PLASTER
  - ROOF.PREP_ACCEPT
  reason: штукатурка не ждёт приёмки патрубков и воронок
- pair:
  - ROOF.FLASHING
  - ROOF.DRAIN_CLAMP
  reason: разные места кровли, параллельные работы
- pair:
  - ROOF.SCREED_JOINTS
  - ROOF.EXPANSION_JOINT
  reason: разные узлы, оба лишь до нижнего слоя
- pair:
  - ROOF.SCREED_JOINTS
  - ROOF.REINFORCE
  reason: оба до нижнего слоя, между собой не связаны
- pair:
  - ROOF.EXPANSION_JOINT
  - ROOF.REINFORCE
  reason: оба до нижнего слоя, между собой не связаны
- pair: [ROOF.EXPANSION_JOINT, ROOF.PRIMER]
  reason: "слои шва укладывают насухо — грунтовка не нужна (рис. узла шва, поз. 6, 7)"
- pair: [ROOF.EJ_CURBS, ROOF.UPSTANDS]
  reason: "бортики шва и бортики у стен — разные места, независимы"
