non_relations:
- pair:
  - FLR.AXES
  - FLR.LEVEL
  reason: обе выполняет геодезист; порядок — его загрузка
- pair:
  - FLR.LAYOUT
  - FLR.BASE_CLEAN
  reason: разные исполнители, обе нужны только рейкам
- pair:
  - WALL.REINFORCEMENT_CLEAN
  - WALL.FORMWORK_SIDE1
  reason: очистка материала не зависит от опалубки
- pair:
  - WALL.REINFORCEMENT_CLEAN
  - WALL.OPENINGS_CLOSE
  reason: мера ТБ и подготовка материала независимы
- pair:
  - WALL.BRACKETS
  - WALL.FORMWORK_CHECK
  reason: параллельные работы после первой стороны
- pair:
  - WALL.PLATFORM
  - WALL.FRAME_INSTALL
  reason: в графике настил (стр. 4) раньше каркасов (стр. 6), но технологической связи нет
- pair:
  - WALL.FRAME_WELDING
  - WALL.EMBEDS
  reason: разные исполнители (сварщик и монтажники); порядок — очередь
- pair:
  - WALL.EMBEDS
  - WALL.CONCRETE_CHECK
  reason: в графике приём бетона (стр. 9) после закладных (стр. 8) — это поставка, не технология
- pair:
  - WALL.STRENGTH_LOAD
  - WALL.STRIP
  reason: разные условия прочности; одно не ждёт другого
- pair:
  - WALL.CURING
  - SLAB.FORM_SUPPORTS
  reason: уход за стенами продолжается во время монтажа опалубки перекрытия
- pair:
  - SLAB.CONCRETE_CHECK
  - SLAB.REBAR_ACCEPT
  reason: приём бетона не ждёт приёмки арматуры; ждёт только укладка
- pair:
  - SLAB.STRENGTH_LOAD
  - SLAB.STRIP
  reason: разные условия прочности
- pair:
  - WALL.FRAME_INSTALL
  - WALL.EMBEDS
  reason: в графике стр. 6, 7 и 8 начинаются одновременно (дни ~4–17)
- pair:
  - WALL.CURING
  - WALL.STRIP
  reason: боковые элементы опалубки снимают при прочности, обеспечивающей сохранность поверхности и кромок (СП 435 п. 10.13, числа нет), а защита открытых поверхностей длится до 70 % проектной прочности (п. 10.6) — уход продолжается после распалубки стен
- pair:
  - SLAB.CURING
  - SLAB.STRIP
  reason: распалубка перекрытия — по табл. 10.1 (не менее 70 % проектной прочности), защита открытых поверхностей — до 70 % (п. 10.6); оба срока определяются набором прочности и контролируются через SLAB.STRENGTH_STRIP, прямого предшествования нет